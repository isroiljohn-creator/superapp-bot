version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nuvi-academy-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HDBBjGYipNExuTMaKqCwvMOropQTEAqW
      POSTGRES_DB: railway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose only to localhost for migrations/debugging from the host
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: nuvi-academy-redis
    restart: always
    command: redis-server --requirepass asnqiUUVoYbzCgQJBcXcpirycTLvavOH
    volumes:
      - redis_data:/data
    ports:
      # Expose only to localhost
      - "127.0.0.1:6379:6379"

  web:
    build: .
    container_name: nuvi-academy-web
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:HDBBjGYipNExuTMaKqCwvMOropQTEAqW@db:5432/railway
      - REDIS_URL=redis://default:asnqiUUVoYbzCgQJBcXcpirycTLvavOH@redis:6379
      - RAILWAY_SERVICE_NAME=web
    ports:
      - "127.0.0.1:8080:8080"

  jobs-bot:
    build: ./nuvi-jobs-bot
    container_name: nuvi-jobs-bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      # asyncpg (used directly here, not via SQLAlchemy) needs a plain
      # postgresql:// URL — the web service's +asyncpg scheme would break it.
      - DATABASE_URL=postgresql://postgres:HDBBjGYipNExuTMaKqCwvMOropQTEAqW@db:5432/railway
      - NUVI_BOT_TOKEN=8556619194:AAGE4dZ0TTr-FN-MDVF0vKuTt8a9YW9E3Uw
      - NUVI_TARGET_CHANNEL=@HirelyUz
      - VACANCY_TG_SESSION_STRING=${VACANCY_TG_SESSION_STRING}
      - HIRELY_LINKS_URL=http://hirely-links:8081
      - HIRELY_LINKS_TOKEN=${HIRELY_LINKS_TOKEN}
      - HIRELY_LINKS_CHANNEL=hirely_uz

  hirely-links:
    build: ./hirely-links
    container_name: hirely-links
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - HIRELY_DATABASE_URL=postgresql+asyncpg://postgres:HDBBjGYipNExuTMaKqCwvMOropQTEAqW@db:5432/railway
      - HIRELY_REDIS_URL=redis://default:asnqiUUVoYbzCgQJBcXcpirycTLvavOH@redis:6379/1
      - HIRELY_PUBLIC_BASE_URL=${HIRELY_PUBLIC_BASE_URL:-https://hrly.uz}
      # Secrets come from GitHub Actions secrets at deploy time (see .github/workflows/deploy.yml)
      - HIRELY_SECRET_KEY=${HIRELY_SECRET_KEY}
      - HIRELY_BOT_API_TOKENS=${HIRELY_BOT_API_TOKENS}
      - HIRELY_BOOTSTRAP_ADMIN_EMAIL=${HIRELY_BOOTSTRAP_ADMIN_EMAIL}
      - HIRELY_BOOTSTRAP_ADMIN_PASSWORD=${HIRELY_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - hirely_media:/data/media
    ports:
      - "127.0.0.1:8081:8081"

  db-backup:
    image: postgres:16-alpine
    container_name: nuvi-db-backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - PGHOST=db
      - PGUSER=postgres
      - PGDATABASE=railway
      - PGPASSWORD=HDBBjGYipNExuTMaKqCwvMOropQTEAqW
      - ALERT_BOT_TOKEN=${ALERT_BOT_TOKEN}
      - ALERT_CHAT_ID=${ALERT_CHAT_ID}
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - db_backups:/backups
      - ./backup/backup.sh:/backup.sh:ro

volumes:
  db_backups:
  hirely_media:
  postgres_data:
  redis_data:
