name: CI

# Reusable: the deploy workflow calls this first and only ships when it is green. Also runs on pull requests.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hirely-links/requirements-dev.txt
      - name: Install
        run: |
          pip install -r hirely-links/requirements-dev.txt
          pip install pytest httpx
      - name: Hirely Links tests (real Postgres, migrations from scratch)
        working-directory: hirely-links
        env:
          HIRELY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
        run: python -m pytest -q
      - name: Vacancy bot client tests
        run: python -m pytest -q nuvi-jobs-bot/tests
