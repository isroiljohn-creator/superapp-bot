name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='nuvi-boshqaruv-repo' \
            --exclude='nuvi-uz-moderator-repo' \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/nuvi-academy-bot/

      - name: Restart Docker Compose services
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "
            docker system prune -af && \
            cd /home/ubuntu/nuvi-academy-bot && \
            docker-compose build && \
            docker-compose down --remove-orphans && \
            VACANCY_TG_SESSION_STRING='${{ secrets.VACANCY_TG_SESSION_STRING }}' \\
            HIRELY_SECRET_KEY='${{ secrets.HIRELY_SECRET_KEY }}' \\
            HIRELY_BOT_API_TOKENS='${{ secrets.HIRELY_BOT_API_TOKENS }}' \\
            HIRELY_BOOTSTRAP_ADMIN_EMAIL='${{ secrets.HIRELY_ADMIN_EMAIL }}' \\
            HIRELY_BOOTSTRAP_ADMIN_PASSWORD='${{ secrets.HIRELY_ADMIN_PASSWORD }}' \\
            docker-compose up -d
          "
