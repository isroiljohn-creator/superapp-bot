name: Setup domain for Hirely Links (nginx + HTTPS)

# Manual, one-off per domain. Adds an nginx server block on the EC2 host and issues a Let's Encrypt
# certificate. Refuses to run until public DNS for every listed name already points at the server.
on:
  workflow_dispatch:
    inputs:
      domains:
        description: "Space-separated host names, e.g. 'go.nuvi.uz' or 'hrly.uz www.hrly.uz'"
        required: true
        default: "hrly.uz www.hrly.uz"

env:
  SERVER_IP: 13.60.170.72
  DOMAINS: ${{ inputs.domains }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input and check that DNS points at the server
        run: |
          [[ "$DOMAINS" =~ ^[a-z0-9.\ -]+$ ]] || { echo "::error::invalid domain list"; exit 1; }
          for h in $DOMAINS; do
            ip=$(dig +short "$h" @8.8.8.8 | tail -1)
            echo "$h -> ${ip:-<no record>}"
            [ "$ip" = "$SERVER_IP" ] || { echo "::error::DNS for $h does not point at $SERVER_IP yet"; exit 1; }
          done

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Configure nginx and issue the certificate
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "sudo DOMAINS='$DOMAINS' bash -s" <<'EOS'
          set -euo pipefail
          FIRST=${DOMAINS%% *}
          if [ -d /etc/nginx/sites-enabled ]; then
            CONF=/etc/nginx/sites-available/hirely-$FIRST
          else
            CONF=/etc/nginx/conf.d/hirely-$FIRST.conf
          fi
          cat > "$CONF" <<'NGINX'
          server {
              listen 80;
              server_name __DOMAINS__;
              client_max_body_size 8m;
              gzip on;
              gzip_types text/css application/javascript application/json image/svg+xml;

              location ~ ^/(j|r|a|t|admin|static|media|healthz|robots\.txt)(/|$) {
                  proxy_pass http://127.0.0.1:8081;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $remote_addr;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 30s;
              }
              location / { return 404; }
          }
          NGINX
          sed -i "s/__DOMAINS__/$DOMAINS/" "$CONF"
          if [ -d /etc/nginx/sites-enabled ]; then ln -sf "$CONF" "/etc/nginx/sites-enabled/hirely-$FIRST"; fi
          nginx -t
          systemctl reload nginx
          command -v certbot >/dev/null || apt-get install -y certbot python3-certbot-nginx
          ARGS=(); for d in $DOMAINS; do ARGS+=(-d "$d"); done
          certbot --nginx "${ARGS[@]}" --non-interactive --agree-tos --register-unsafely-without-email --redirect --keep-until-expiring
          nginx -t && systemctl reload nginx
          echo "--- check"
          curl -fsS "https://$FIRST/healthz"
          EOS
