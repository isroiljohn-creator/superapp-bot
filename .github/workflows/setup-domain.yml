name: Setup hrly.uz (nginx + HTTPS)

# Manual, one-off. Adds the hrly.uz server block to the EC2 nginx and issues a Let's Encrypt certificate.
# Refuses to run until public DNS for hrly.uz and www.hrly.uz already points at the server.
on: workflow_dispatch

env:
  SERVER_IP: 13.60.170.72

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: DNS must already point at the server
        run: |
          for h in hrly.uz www.hrly.uz; do
            ip=$(dig +short "$h" @8.8.8.8 | tail -1)
            echo "$h -> ${ip:-<no record>}"
            [ "$ip" = "$SERVER_IP" ] || { echo "::error::DNS for $h does not point at $SERVER_IP yet"; exit 1; }
          done

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Configure nginx and issue the certificate
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} 'sudo bash -s' <<'EOS'
          set -euo pipefail
          if [ -d /etc/nginx/sites-enabled ]; then
            CONF=/etc/nginx/sites-available/hrly.uz
          else
            CONF=/etc/nginx/conf.d/hrly.uz.conf
          fi
          cat > "$CONF" <<'NGINX'
          server {
              listen 80;
              server_name hrly.uz www.hrly.uz;
              client_max_body_size 8m;
              gzip on;
              gzip_types text/css application/javascript application/json image/svg+xml;

              location ~ ^/(j|r|a|t|admin|static|media|healthz|robots\.txt)(/|$) {
                  proxy_pass http://127.0.0.1:8081;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $remote_addr;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 30s;
              }
              location / { return 404; }
          }
          NGINX
          if [ -d /etc/nginx/sites-enabled ]; then ln -sf "$CONF" /etc/nginx/sites-enabled/hrly.uz; fi
          nginx -t
          systemctl reload nginx
          command -v certbot >/dev/null || apt-get install -y certbot python3-certbot-nginx
          certbot --nginx -d hrly.uz -d www.hrly.uz --non-interactive --agree-tos --register-unsafely-without-email --redirect --keep-until-expiring
          nginx -t && systemctl reload nginx
          echo "--- check"
          curl -fsS https://hrly.uz/healthz
          EOS
