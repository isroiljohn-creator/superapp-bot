server {
    listen 80;
    server_name www.nuvi.uz nuvi.uz;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Hirely Links (served on hrly.uz for now) — contact landing, click tracking, ads admin (container: hirely-links, 127.0.0.1:8081).
# /api is intentionally NOT proxied: the bot calls http://hirely-links:8081/api/jobs over the Docker
# network. If a bot runs elsewhere, add `api` to the location regex below.
# Suggested (http context, not here): limit_req_zone $binary_remote_addr zone=hirely:10m rate=30r/s;
server {
    listen 80;
    server_name hrly.uz www.hrly.uz;
    client_max_body_size 8m;   # banner uploads (app limit is 6 MB)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(j|r|a|t|admin|static|media|healthz|robots\.txt)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # SET, never appended: the app trusts this header
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
}
