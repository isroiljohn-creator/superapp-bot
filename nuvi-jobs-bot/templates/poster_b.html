<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Sora';src:url('{{FONT_DIR}}/Sora-Variable.ttf');font-weight:100 800;}
@font-face{font-family:'Manrope';src:url('{{FONT_DIR}}/Manrope-Variable.ttf');font-weight:200 800;}
body{margin:0;background:#fff;}
</style></head><body>

<div style="width:1200px; height:675px; box-sizing:border-box; display:flex; flex-direction:row;">

  <div style="width:420px; flex-shrink:0; background:#8CF56E; padding:40px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;">
    <svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg" style="position:absolute; bottom:-46px; left:-46px; opacity:0.16;">
      <rect x="84" y="112" width="32" height="30" rx="15" fill="#163A26"></rect>
      <g><circle cx="62" cy="52" r="24" fill="#163A26"></circle><rect x="30" y="80" width="64" height="100" rx="30" fill="#163A26"></rect></g>
      <g transform="translate(200,0) scale(-1,1)"><circle cx="62" cy="52" r="24" fill="#163A26"></circle><rect x="30" y="80" width="64" height="100" rx="30" fill="#163A26"></rect></g>
    </svg>

    <div style="display:flex; flex-direction:column; gap:10px; position:relative;">
      <div style="display:flex; flex-direction:row; align-items:center; gap:9px;">
        <svg viewBox="0 0 200 200" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
          <rect x="84" y="112" width="32" height="30" rx="15" fill="#163A26" opacity="0.7"></rect>
          <g><circle cx="62" cy="52" r="24" fill="#163A26"></circle><rect x="30" y="80" width="64" height="100" rx="30" fill="#163A26"></rect></g>
          <g transform="translate(200,0) scale(-1,1)"><circle cx="62" cy="52" r="24" fill="#163A26"></circle><rect x="30" y="80" width="64" height="100" rx="30" fill="#163A26"></rect></g>
        </svg>
        <div style="font-family:'Sora',sans-serif; font-weight:800; font-size:20px; color:#163A26;">HIRELY JOBS</div>
      </div>
      <div style="font-family:'Manrope',sans-serif; font-weight:500; font-style:italic; font-size:14px; color:#1F4A30;">Xayrli uchrashuvlar maskani</div>
    </div>

    <div style="position:relative; display:flex; flex-direction:column; gap:10px;">
      <div style="font-family:'Sora',sans-serif; font-weight:800; font-size:40px; line-height:1.08; color:#163A26;">Yangi<br>vakansiya</div>
      <div style="font-family:'Manrope',sans-serif; font-weight:600; font-size:14px; color:#1F4A30;">Tezkor ariza &middot; Ishonchli taklif</div>
    </div>
  </div>

  <div style="flex-grow:1; background:#F7FAF6; padding:44px 52px; display:flex; flex-direction:column;">
    <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.12em; color:#A9B6A7; text-transform:uppercase;">Lavozim</div>

    <div style="flex-grow:1; display:flex; align-items:center;">
      <div style="font-family:'Sora',sans-serif; font-weight:800; font-size:{{TITLE_SIZE}}px; line-height:1.04; color:#163A26; letter-spacing:-0.01em; text-transform:uppercase;">{{POSITION}}</div>
    </div>

    <div style="display:flex; flex-direction:row; gap:48px; padding-bottom:20px;">
      <div style="display:flex; flex-direction:column; gap:5px;">
        <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.08em; color:#A9B6A7; text-transform:uppercase;">Kompaniya</div>
        <div style="font-family:'Sora',sans-serif; font-weight:600; font-size:19px; color:#163A26;">{{COMPANY}}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.08em; color:#A9B6A7; text-transform:uppercase;">Maosh</div>
        <div style="font-family:'Sora',sans-serif; font-weight:700; font-size:19px; color:#163A26; background:#8CF56E; padding:4px 12px; border-radius:8px; display:inline-block; width:fit-content;">{{SALARY}}</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:row; justify-content:space-between; align-items:center; border-top:1px solid #DCE6D9; padding-top:16px;">
      <div style="font-family:'Manrope',sans-serif; font-weight:500; font-size:13px; color:#A9B6A7;">{{CHANNEL}}</div>
      <div style="font-family:'Manrope',sans-serif; font-weight:600; font-size:13px; color:#A9B6A7;">Hirely Jobs</div>
    </div>
  </div>

</div>
</body></html>
