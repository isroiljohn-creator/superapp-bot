<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Sora';src:url('{{FONT_DIR}}/Sora-Variable.ttf');font-weight:100 800;}
@font-face{font-family:'Manrope';src:url('{{FONT_DIR}}/Manrope-Variable.ttf');font-weight:200 800;}
body{margin:0;background:#fff;}
</style></head><body>

<div style="width:1200px; height:675px; box-sizing:border-box; background:#163A26; padding:22px; display:flex;">

  <div style="flex-grow:1; background:#F7FAF6; border-radius:22px; padding:44px 56px; display:flex; flex-direction:column; align-items:center; text-align:center;">

    <div style="display:flex; flex-direction:row; align-items:center; gap:10px;">
      <svg viewBox="0 0 200 200" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
        <rect x="84" y="112" width="32" height="30" rx="15" fill="#163A26"></rect>
        <g><circle cx="62" cy="52" r="24" fill="#8CF56E"></circle><rect x="30" y="80" width="64" height="100" rx="30" fill="#8CF56E"></rect></g>
        <g transform="translate(200,0) scale(-1,1)"><circle cx="62" cy="52" r="24" fill="#163A26"></circle><rect x="30" y="80" width="64" height="100" rx="30" fill="#163A26"></rect></g>
      </svg>
      <div style="font-family:'Sora',sans-serif; font-weight:800; font-size:22px; color:#163A26;">HIRELY</div>
      <div style="font-family:'Sora',sans-serif; font-weight:800; font-size:13px; color:#163A26; background:#8CF56E; padding:3px 9px; border-radius:6px;">JOBS</div>
    </div>

    <div style="font-family:'Manrope',sans-serif; font-weight:500; font-style:italic; font-size:14px; color:#5F6F5C; margin-top:10px;">Xayrli uchrashuvlar maskani</div>

    <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.14em; color:#A9B6A7; text-transform:uppercase; margin-top:14px;">Yangi vakansiya &nbsp;&middot;&nbsp; Tezkor ariza &nbsp;&middot;&nbsp; Ishonchli taklif</div>

    <div style="flex-grow:1; display:flex; align-items:center; justify-content:center;">
      <div style="font-family:'Sora',sans-serif; font-weight:800; font-size:{{TITLE_SIZE}}px; line-height:1.05; color:#163A26; letter-spacing:-0.01em; text-transform:uppercase; max-width:820px;">{{POSITION}}</div>
    </div>

    <div style="display:flex; flex-direction:row; align-items:center; gap:22px; margin-bottom:22px;">
      <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
        <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.08em; color:#A9B6A7; text-transform:uppercase;">Kompaniya</div>
        <div style="font-family:'Sora',sans-serif; font-weight:600; font-size:19px; color:#163A26;">{{COMPANY}}</div>
      </div>
      <div style="width:1px; height:38px; background:#DCE6D9;"></div>
      <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
        <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.08em; color:#A9B6A7; text-transform:uppercase;">Maosh</div>
        <div style="font-family:'Sora',sans-serif; font-weight:700; font-size:15px; color:#163A26; background:#8CF56E; padding:5px 14px; border-radius:8px;">{{SALARY}}</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:row; justify-content:space-between; align-items:center; width:100%; border-top:1px solid #DCE6D9; padding-top:16px;">
      <div style="font-family:'Manrope',sans-serif; font-weight:500; font-size:13px; color:#A9B6A7;">{{CHANNEL}}</div>
      <div style="font-family:'Manrope',sans-serif; font-weight:600; font-size:13px; color:#A9B6A7;">Hirely Jobs</div>
    </div>

  </div>
</div>
</body></html>
